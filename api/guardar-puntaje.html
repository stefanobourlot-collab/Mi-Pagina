<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Guardar Puntaje - Stefano Bourlot</title>
    <style>
        body {
            background: #0a0f1e;
            color: white;
            font-family: monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .resultado {
            background: #1a2035;
            padding: 20px;
            border-radius: 15px;
            text-align: center;
        }
        .exito { color: #4ade80; }
        .error { color: #ef4444; }
    </style>
</head>
<body>
    <div class="resultado" id="resultado">
        Procesando...
    </div>

    <script>
        // Obtener datos de la URL
        const urlParams = new URLSearchParams(window.location.search);
        const nombre = urlParams.get('nombre') || 'Anónimo';
        const puntaje = parseInt(urlParams.get('puntaje'));

        const resultadoDiv = document.getElementById('resultado');

        if (!puntaje || isNaN(puntaje)) {
            resultadoDiv.innerHTML = '<h2 class="error">❌ Error</h2><p>Falta el puntaje</p>';
        } else {
            // Obtener puntajes actuales
            fetch('record.json')
                .then(res => res.json())
                .then(data => {
                    // Agregar nuevo puntaje
                    data.mejoresPuntajes.push({
                        nombre: nombre.substring(0, 20),
                        puntaje: puntaje,
                        fecha: new Date().toISOString().split('T')[0]
                    });
                    
                    // Ordenar de mayor a menor
                    data.mejoresPuntajes.sort((a, b) => b.puntaje - a.puntaje);
                    
                    // Guardar solo los 10 mejores
                    data.mejoresPuntajes = data.mejoresPuntajes.slice(0, 10);
                    
                    // Mostrar resultado
                    let posicion = data.mejoresPuntajes.findIndex(p => p.puntaje === puntaje && p.nombre === (nombre.substring(0, 20))) + 1;
                    
                    resultadoDiv.innerHTML = `
                        <h2 class="exito">🎉 PUNTAJE GUARDADO 🎉</h2>
                        <p><strong>${nombre}</strong> - ${puntaje} puntos</p>
                        <p>🏆 Posición #${posicion} en el ranking mundial</p>
                        <hr>
                        <h3>TOP 10 MUNDIAL</h3>
                        <ol style="text-align: left;">
                            ${data.mejoresPuntajes.map(p => `<li><strong>${p.nombre}</strong> - ${p.puntaje} pts (${p.fecha})</li>`).join('')}
                        </ol>
                        <br>
                        <button onclick="window.close()" style="background:#667eea; color:white; border:none; padding:10px 20px; border-radius:10px;">Cerrar</button>
                    `;
                    
                    // Guardar en GitHub NO ES POSIBLE directamente
                    // Mostrar instrucciones
                    resultadoDiv.innerHTML += `
                        <hr>
                        <div style="background:#ffcc00; color:#000; padding:10px; border-radius:10px; margin-top:15px;">
                            ⚠️ <strong>IMPORTANTE</strong><br>
                            GitHub Pages no permite guardar archivos automáticamente.<br>
                            Los puntajes se guardan en <strong>cada jugador</strong> individualmente.<br>
                            Para un ranking global, necesitarías un servidor real.
                        </div>
                    `;
                })
                .catch(error => {
                    resultadoDiv.innerHTML = `<h2 class="error">❌ Error</h2><p>No se pudo guardar: ${error.message}</p>`;
                });
        }
    </script>
</body>
</html>
